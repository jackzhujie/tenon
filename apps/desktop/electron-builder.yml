# 打包配置。三条约定都在 `build.mjs` 里铺好了，这里只负责搬运：
#
# - `files` 只放主进程：`dist/main.mjs` 的外部依赖只有 `electron` 本身，
#   所以 asar 里没有任何需要按平台编译的东西（铁律 3，`build.mjs` 末尾会扫一遍）
# - `extraResources` 把 `dist/{server,web,templates}` 原样放到 `Contents/Resources/` 下，
#   和开发态的 `apps/desktop/dist/` **同构** —— 主进程不需要知道自己在不在 asar 里
# - `identity: null`：本地冒烟不签名。正式发布要换成真证书（M6 才会碰到）
appId: dev.tenon.app
productName: Tenon
copyright: Tenon

directories:
  output: release
  buildResources: build

files:
  - dist/main.mjs
  # ★ 别漏这一行：漏了的话窗口里 preload 加载失败、更新入口整块消失，
  # 而应用其它部分一切正常 —— 这种"少一个文件"的故障不会有人报上来。
  - dist/preload.cjs
  - package.json

extraResources:
  # ★ `filter: '**/*'` 不能省：electron-builder 默认把 `node_modules` 当依赖目录跳过，
  # 于是 `dist/server/node_modules/{pglite,pnpm}` 不会进包 —— 表现是打包后 server 启动即退出
  # （`Cannot find package '@electric-sql/pglite'`），而构建日志一切正常。
  - from: dist/server
    to: server
    filter:
      - '**/*'
  # ★ node_modules 必须单独列一条，`from` 指到它里面。
  # electron-builder 对相对路径里出现 `node_modules` 的文件一律跳过（怕重复打包依赖），
  # 所以写在上面那条里永远拷不进去；从 `node_modules` 目录本身出发时，
  # 内部的相对路径（`@electric-sql/pglite/dist/...`）不含这段，就不被过滤。
  - from: dist/server/node_modules
    to: server/node_modules
    filter:
      - '**/*'
  - from: dist/web
    to: web
  - from: dist/templates
    to: templates
  # 官方组件：加载器按真实目录扫描 manifest.json，同样必须在 asar 外面
  - from: dist/plugins
    to: plugins
  # ★ Hub 配置（M6 第 5 步）：主进程把它指成 `TENON_HUB_CONFIG_FILE`，业务侧负责读。
  # `build.mjs` **总是**写这个文件（没配 Hub 就写空值），因为这里指向一个不存在的来源
  # 会让打包整个失败 —— 那等于"没配 Hub 就没法打包"，太脆了。
  - from: dist/hub.json
    to: hub.json

asar: true
# 模板与页面在 asar 外面（生成器要按真实路径读文件），所以只有主进程进 asar

# ★ 更新源（M6 之后的第一块欠账，见 docs/BACKLOG.md §1.1）
#
# 写了这一段，`electron-builder` 才会在打出来的包里放一份 `Resources/app-update.yml`，
# 并按 provider 生成 `latest.yml` / `latest-mac.yml` —— **没有这段，`electron-updater`
# 连"去哪儿问有没有新版"都不知道**，而它不会报错，只会一直说"已是最新"。
#
# 为什么用 GitHub Releases：产物本来就挂在 Release 上（desktop.yml），
# 不需要额外买对象存储、也不需要自己维护索引签名（组件 Hub 那套是另一回事）。
# 代价：国内网络访问 GitHub 不稳 —— 所以 `TENON_UPDATE_FEED` 留了覆盖入口，
# 将来托管到自己的域名时不用改代码。
publish:
  provider: github
  owner: jackzhujie
  repo: tenon
  # 预发布版本（0.0.0-alpha.x）走 `latest` 频道并由 `allowPrerelease` 决定可见性，
  # 不用单独开 alpha 频道 —— 一份频道少一类"用户装了却收不到"的故障。
  releaseType: prerelease

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
    - target: zip

win:
  # ★ 文件名别带空格：NSIS 默认产出 `Tenon Setup 0.0.0.exe`，而 GitHub Release 会把空格
  # 换成点（`Tenon.Setup.0.0.0.exe`）—— 于是"文档写的名字"和"下到的名字"对不上，
  # 命令行里还得加引号。在源头定成一次一致的形状。
  artifactName: ${productName}-${version}-setup.${ext}
  target:
    - target: nsis

linux:
  category: Development
  # ★ 必须显式给一个干净的名字。`package.json` 的 name 是 `@tenon/desktop`，
  # electron-builder 会把它去掉斜杠拼成可执行名 `@tenondesktop` —— 而 AppImage
  # **不允许路径里出现 `@`**，构建直接失败：
  #   ⨯ executableName contains characters that cannot be safely used in file paths: @tenondesktop
  # 这条只有在 Linux 上才会炸（mac/win 用的是 productName）。CI 三平台第一次跑抓到的。
  executableName: tenon
  target:
    - target: AppImage
