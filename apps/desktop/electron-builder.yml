# 打包配置。三条约定都在 `build.mjs` 里铺好了，这里只负责搬运：
#
# - `files` 只放主进程：`dist/main.mjs` 的外部依赖只有 `electron` 本身，
#   所以 asar 里没有任何需要按平台编译的东西（铁律 3，`build.mjs` 末尾会扫一遍）
# - `extraResources` 把 `dist/{server,web,templates}` 原样放到 `Contents/Resources/` 下，
#   和开发态的 `apps/desktop/dist/` **同构** —— 主进程不需要知道自己在不在 asar 里
# - `identity: null`：本地冒烟不签名。正式发布要换成真证书（M6 才会碰到）
appId: dev.tenon.app
productName: Tenon
copyright: Tenon

directories:
  output: release
  buildResources: build

files:
  - dist/main.mjs
  - package.json

extraResources:
  # ★ `filter: '**/*'` 不能省：electron-builder 默认把 `node_modules` 当依赖目录跳过，
  # 于是 `dist/server/node_modules/{pglite,pnpm}` 不会进包 —— 表现是打包后 server 启动即退出
  # （`Cannot find package '@electric-sql/pglite'`），而构建日志一切正常。
  - from: dist/server
    to: server
    filter:
      - '**/*'
  # ★ node_modules 必须单独列一条，`from` 指到它里面。
  # electron-builder 对相对路径里出现 `node_modules` 的文件一律跳过（怕重复打包依赖），
  # 所以写在上面那条里永远拷不进去；从 `node_modules` 目录本身出发时，
  # 内部的相对路径（`@electric-sql/pglite/dist/...`）不含这段，就不被过滤。
  - from: dist/server/node_modules
    to: server/node_modules
    filter:
      - '**/*'
  - from: dist/web
    to: web
  - from: dist/templates
    to: templates
  # 官方组件：加载器按真实目录扫描 manifest.json，同样必须在 asar 外面
  - from: dist/plugins
    to: plugins
  # ★ Hub 配置（M6 第 5 步）：主进程把它指成 `TENON_HUB_CONFIG_FILE`，业务侧负责读。
  # `build.mjs` **总是**写这个文件（没配 Hub 就写空值），因为这里指向一个不存在的来源
  # 会让打包整个失败 —— 那等于"没配 Hub 就没法打包"，太脆了。
  - from: dist/hub.json
    to: hub.json

asar: true
# 模板与页面在 asar 外面（生成器要按真实路径读文件），所以只有主进程进 asar

mac:
  category: public.app-category.developer-tools
  identity: null
  target:
    - target: dmg
    - target: zip

win:
  target:
    - target: nsis

linux:
  category: Development
  target:
    - target: AppImage
