## 桌面安装包：三个平台各打一份
##
## 为什么单独一个 workflow，而不是塞进 ci.yml：
## - 它**慢且重**（每台机器都要下一个 ~100MB 的 Electron、再打 130MB 的包）。
##   门禁的价值是"最新这一次绿不绿"，不该被这个拖到十几分钟。
## - 它**不需要每次 push 都跑**。packaging 的输入是 tag / 手点，不是每行代码。
##
## 为什么当初 CI 里写着"不做三平台打包"，现在又做了：
## 那条注释的理由是"mac 不签名会被 Gatekeeper 拦" —— 那说的是**可信分发**。
## 而"能不能构建"是另一件事：Windows 的 nsis 只能在 Windows 上打（mac 上要 wine），
## Linux 的 AppImage 只能在 Linux 上打。没有这条流水线，这两个平台的安装包
## **永远只能停在"没产出"**，而我们在自己机器上没有那两台机器。
##
## 签名仍然不做（没有证书）：产物是**未签名**的。
## - macOS：别人机器上 Gatekeeper 会拦（右键打开一次，或 `xattr -dr com.apple.quarantine`）
## - Windows：SmartScreen 会提示"未知发布者"
## 要做成"双击就装、不弹警告"，需要 Apple Developer（$99/年）与 Windows 代码签名证书，
## 那是钱的问题；它们只影响**信任**，不影响**能不能装上试用**。

name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的 ref（空=当前分支）'
        required: false
  push:
    tags:
      - 'v*'

# 同一 ref 连点两次时取消旧的：packaging 没有"两次都要"的意义
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.tag }}
    strategy:
      # 一个平台失败不该让另外几份产物跟着丢 —— 每份产物是互相独立的价值
      fail-fast: false
      matrix:
        include:
          # macOS runner 现在是 Apple Silicon：默认出 arm64。Intel 用户要 x64，
          # 所以用交叉编译再出一份（`--x64` 只是换一个 Electron 二进制，没有原生模块要重编）。
          - os: macos-latest
            tag: mac-arm64
            args: ''
            smoke: true
            cache: mac-arm64
          - os: macos-latest
            tag: mac-x64
            args: '--x64'
            # 交叉产物在这个 runner 上要 Rosetta 才能跑，冒烟只对宿主架构那一份做
            smoke: false
            cache: mac-x64
          - os: windows-latest
            tag: win-x64
            args: ''
            smoke: false
            cache: win
          - os: ubuntu-latest
            tag: linux-x64
            args: ''
            smoke: false
            cache: linux
    runs-on: ${{ matrix.os }}
    # Windows 上装依赖 + 打 nsis 明显比另外两个慢
    timeout-minutes: 45
    env:
      # 没有证书：别让 electron-builder 去钥匙串里找，找不到会报警告甚至失败
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 装 pnpm（版本来自 packageManager）
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # Electron 与 electron-builder 的二进制缓存：不缓存的话每跑一次都要重下 ~200MB
      - name: 缓存 Electron 与 electron-builder 的二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.cache }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ matrix.cache }}-

      - name: 装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      # 三个产物共用这一步：web 产物 + 组件 + 主进程，铺成同构的 apps/desktop/dist
      - name: 构建（web + 组件 + 主进程）
        run: pnpm build:desktop

      # 目标在 electron-builder.yml 里按平台配好了（mac: dmg+zip / win: nsis / linux: AppImage）
      - name: 打安装包
        run: pnpm --filter @tenon/desktop exec electron-builder ${{ matrix.args }} --publish never

      # macOS 上**真启动一次**打包产物：产物存在不等于能跑（历史上踩过"装完白屏"）。
      # Windows / Linux 上没有等价的冒烟脚本（要 GUI 会话），所以那边只验"打得出来"。
      - name: 冒烟：真启动打包产物（仅宿主架构的 macOS 那一份）
        if: matrix.smoke
        run: pnpm smoke:desktop:packaged

      - name: 列出产物
        shell: bash
        run: |
          ls -lh apps/desktop/release | head -20
          # `release/mac` 之类的解包目录是给冒烟用的，不必上传；只看安装包本体。
          # 刻意不用 `find -printf`：那是 GNU 的，macOS 的 BSD find 不认（会直接报错退出）
          for f in apps/desktop/release/*.dmg apps/desktop/release/*.zip \
                   apps/desktop/release/*.exe apps/desktop/release/*.AppImage; do
            [ -e "$f" ] || continue
            printf '  %s  %s 字节\n' "$(basename "$f")" "$(wc -c < "$f" | tr -d ' ')"
          done

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: tenon-${{ matrix.tag }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          # 130MB 级产物，保留 14 天够试用；长期归档应该走 Release，不是 artifact
          retention-days: 14

  # 推 tag 时把四份产物挂到 GitHub Release 上。
  #
  # 为什么要有这一步：artifact **14 天就过期，而且下载要登录**。想让人（或明天的自己）
  # 换个机器装一遍，需要的是一个稳定链接。Release 资产就是那个链接。
  #
  # 只在推 tag 时跑：Release 是"我决定发一版"的动作，不该由一次手点的打包触发。
  release:
    name: Release（推 tag 时）
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 四个产物各落到 dist/<artifact 名>/ 下
          pattern: tenon-*
          path: dist

      # 校验和解决的是"下载有没有坏"，不是"东西是不是我发的"（没有签名就做不到后者）。
      # 大文件在这台机器上实测会 EOF —— 有个 sha256 至少能区分"没下完"和"包本身坏了"。
      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(*/*.dmg */*.zip */*.exe */*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::一个产物都没有，先看 package 那几个 job"
            exit 1
          fi
          sha256sum "${files[@]}" | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 写 Release 说明
        shell: bash
        run: |
          cat > NOTES.md <<'NOTES'
          预览构建（未签名）。四个平台各一份，都是**免安装依赖**的整包：
          Node 不用装、pnpm 随包、数据库是 WASM。

          | 文件 | 平台 |
          |---|---|
          | `Tenon-*-arm64.dmg` / `-arm64-mac.zip` | macOS（Apple Silicon） |
          | `Tenon-*.dmg` / `-mac.zip`（无 arm64 后缀） | macOS（Intel） |
          | `Tenon Setup *.exe` | Windows x64（NSIS 安装包） |
          | `Tenon-*.AppImage` | Linux x64 |

          ## 未签名，系统会拦一次

          没有 Apple / Windows 代码签名证书，所以：

          - **macOS**：双击会提示"无法验证开发者"。右键 → 打开 → 再点"打开"；
            或终端 `xattr -dr com.apple.quarantine /Applications/Tenon.app`
          - **Windows**：SmartScreen 提示"未知发布者"。点"更多信息" → "仍要运行"
          - **Linux**：`chmod +x Tenon-*.AppImage` 再运行

          这不是包坏了，是没买证书。只影响第一次打开时的信任提示。

          ## 校验

          下载完先比一下 `SHA256SUMS.txt`（分辨"没下完"和"包本身坏了"）：

          ```bash
          shasum -a 256 -c SHA256SUMS.txt   # macOS / Linux
          ```

          ## 已知限制

          - Windows / Linux 的产物**没有被真启动过**（CI 上没有 GUI 会话）；
            只有 macOS 那份每次都会在 CI 里真启动一次。
          - 没有 Hub：「组件商店」会显示未配置，本地三个官方组件可正常安装使用。
          - 模型要自己配（OpenAI 兼容即可）；不配也能建应用、看 HMR，只是对话是 faux 假回复。
          NOTES
          cat NOTES.md

      - name: 建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 不 checkout（只要产物），所以 `gh` 需要显式告诉它仓库是哪个 ——
          # 否则报 `failed to run git: fatal: not a git repository`
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          files=(dist/*/*.dmg dist/*/*.zip dist/*/*.exe dist/*/*.AppImage dist/SHA256SUMS.txt)

          # 带预发布后缀的 tag（如 v0.0.0-alpha.1）标成 prerelease，别让人以为这是正式版
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease);; esac

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传（重跑同一 tag 是常见操作）"
            gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" -R "$REPO" \
              --title "Tenon $TAG" \
              --notes-file NOTES.md \
              "${extra[@]}"
          fi
          gh release view "$TAG" -R "$REPO" --json url,assets --jq '"URL: \(.url)\n" + (.assets[] | "  \(.name)  \(.size/1024/1024|floor)MB")'
