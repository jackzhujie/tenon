## 桌面安装包：三个平台各打一份
##
## 为什么单独一个 workflow，而不是塞进 ci.yml：
## - 它**慢且重**（每台机器都要下一个 ~100MB 的 Electron、再打 130MB 的包）。
##   门禁的价值是"最新这一次绿不绿"，不该被这个拖到十几分钟。
## - 它**不需要每次 push 都跑**。packaging 的输入是 tag / 手点，不是每行代码。
##
## 为什么当初 CI 里写着"不做三平台打包"，现在又做了：
## 那条注释的理由是"mac 不签名会被 Gatekeeper 拦" —— 那说的是**可信分发**。
## 而"能不能构建"是另一件事：Windows 的 nsis 只能在 Windows 上打（mac 上要 wine），
## Linux 的 AppImage 只能在 Linux 上打。没有这条流水线，这两个平台的安装包
## **永远只能停在"没产出"**，而我们在自己机器上没有那两台机器。
##
## 签名仍然不做（没有证书）：产物是**未签名**的。
## - macOS：别人机器上 Gatekeeper 会拦（右键打开一次，或 `xattr -dr com.apple.quarantine`）
## - Windows：SmartScreen 会提示"未知发布者"
## 要做成"双击就装、不弹警告"，需要 Apple Developer（$99/年）与 Windows 代码签名证书，
## 那是钱的问题；它们只影响**信任**，不影响**能不能装上试用**。

name: Desktop packages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: '要打包的 ref（空=当前分支）'
        required: false
  push:
    tags:
      - 'v*'

# 同一 ref 连点两次时取消旧的：packaging 没有"两次都要"的意义
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.tag }}
    strategy:
      # 一个平台失败不该让另外几份产物跟着丢 —— 每份产物是互相独立的价值
      fail-fast: false
      matrix:
        include:
          # macOS runner 现在是 Apple Silicon：默认出 arm64。Intel 用户要 x64，
          # 所以用交叉编译再出一份（`--x64` 只是换一个 Electron 二进制，没有原生模块要重编）。
          - os: macos-latest
            tag: mac-arm64
            args: ''
            smoke: true
            cache: mac-arm64
          - os: macos-latest
            tag: mac-x64
            args: '--x64'
            # 交叉产物在这个 runner 上要 Rosetta 才能跑，冒烟只对宿主架构那一份做
            smoke: false
            cache: mac-x64
          - os: windows-latest
            tag: win-x64
            args: ''
            smoke: false
            cache: win
          - os: ubuntu-latest
            tag: linux-x64
            args: ''
            smoke: false
            cache: linux
    runs-on: ${{ matrix.os }}
    # Windows 上装依赖 + 打 nsis 明显比另外两个慢
    timeout-minutes: 45
    env:
      #
      # 签名凭据一律从 Secrets 来；**没配就是空串**，此时 electron-builder 跳过签名，
      # 产物与这一版之前完全一致（这条"没证书也能出包"的路径是有意保住的：
      # 一个没有证书的 fork 也应当能打出包来试）。
      #
      # 为什么 mac 与 win 分开两个 secret：两边的证书不是同一种东西
      # （.p12 的 Developer ID 证书 vs Windows 代码签名证书），不能混用。
      #
      # ★ 这里只能用 `matrix.os`，**不能用 `runner.os`**：`runner` 上下文在
      # `jobs.<id>.env` 里不可用（要等分配了 runner 才有），写了会让整个 workflow
      # 解析期就报 "Unrecognized named-value: 'runner'" —— 而那一步连日志都不会有。
      # 到了 step 级别才可以用 `runner.os`（下面的公证/验证步骤就是这么写的）。
      CSC_LINK: ${{ startsWith(matrix.os, 'macos') && secrets.MAC_CSC_LINK || startsWith(matrix.os, 'windows') && secrets.WIN_CSC_LINK || '' }}
      CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'macos') && secrets.MAC_CSC_KEY_PASSWORD || startsWith(matrix.os, 'windows') && secrets.WIN_CSC_KEY_PASSWORD || '' }}
      # 公证三件套（只有 macOS 用得上）。三个都给齐才会开启，见下面的"开启公证"一步
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: 装 pnpm（版本来自 packageManager）
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # Electron 与 electron-builder 的二进制缓存：不缓存的话每跑一次都要重下 ~200MB
      - name: 缓存 Electron 与 electron-builder 的二进制
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ matrix.cache }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            electron-${{ matrix.cache }}-

      - name: 装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      # 三个产物共用这一步：web 产物 + 组件 + 主进程，铺成同构的 apps/desktop/dist
      - name: 构建（web + 组件 + 主进程）
        run: pnpm build:desktop

      #
      # 没有证书时关掉"去钥匙串里找身份"：runner 上没有 identity 时，electron-builder
      # 会打一行 skipped 警告继续跑；但我们没必要让它去翻，也避免有人事后从日志里
      # 误以为"本来想签、没签成"。
      #
      # 有证书时**不要**设这个变量：`CSC_LINK` 指向的 .p12 要被导入临时钥匙串，
      # 关掉自动发现会让那条路走不通。
      - name: 无证书时关闭身份自动发现
        if: env.CSC_LINK == ''
        shell: bash
        run: echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      # 公证是 macOS 专属，而且必须三件套齐全；缺一个就开着的话 electron-builder 会直接失败，
      # 所以做成"有条件才开"，而不是在 yml 里写死 notarize: true。
      - name: 有 Apple 凭据时开启公证
        if: runner.os == 'macOS' && env.APPLE_ID != '' && env.APPLE_APP_SPECIFIC_PASSWORD != '' && env.APPLE_TEAM_ID != ''
        shell: bash
        run: echo "SIGN_ARGS=-c.mac.notarize=true" >> "$GITHUB_ENV"

      # 目标在 electron-builder.yml 里按平台配好了（mac: dmg+zip / win: nsis / linux: AppImage）
      - name: 打安装包
        run: pnpm --filter @tenon/desktop exec electron-builder ${{ matrix.args }} --publish never ${{ env.SIGN_ARGS }}

      #
      # 签名与公证都要**验一遍**，不然"签了"只是构建日志里的一句话。
      # 三条命令各验一件事：签名完整（codesign --verify）、Gatekeeper 放行（spctl）、
      # 公证票据已钉在包里（stapler validate）。
      #
      # `spctl` 对未公证的已签名包会 reject —— 那不是失败，是"还没公证"，所以分开判。
      - name: 验证签名（macOS，有证书才跑）
        if: runner.os == 'macOS' && env.CSC_LINK != ''
        shell: bash
        run: |
          APP=$(ls -d apps/desktop/release/mac*/Tenon.app | head -1)
          echo "产物：$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | sed -n '1,12p'
          if [ -n "${{ env.SIGN_ARGS }}" ]; then
            xcrun stapler validate "$APP"
            spctl -a -vvv --type execute "$APP"
          else
            echo "::warning::本次没有公证（缺 APPLE_* 三件套），Gatekeeper 首次打开仍会拦一次"
          fi

      - name: 验证签名（Windows，有证书才跑）
        if: runner.os == 'Windows' && env.CSC_LINK != ''
        shell: pwsh
        run: |
          $exe = Get-ChildItem apps/desktop/release/*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "文件：$($exe.Name)"
          Write-Host "状态：$($sig.Status)"
          Write-Host "签名者：$($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "签名无效：$($sig.Status)" }

      # macOS 上**真启动一次**打包产物：产物存在不等于能跑（历史上踩过"装完白屏"）。
      # Windows / Linux 上没有等价的冒烟脚本（要 GUI 会话），所以那边只验"打得出来"。
      - name: 冒烟：真启动打包产物（仅宿主架构的 macOS 那一份）
        if: matrix.smoke
        run: pnpm smoke:desktop:packaged

      - name: 列出产物
        shell: bash
        run: |
          ls -lh apps/desktop/release | head -20
          # `release/mac` 之类的解包目录是给冒烟用的，不必上传；只看安装包本体。
          # 刻意不用 `find -printf`：那是 GNU 的，macOS 的 BSD find 不认（会直接报错退出）
          for f in apps/desktop/release/*.dmg apps/desktop/release/*.zip \
                   apps/desktop/release/*.exe apps/desktop/release/*.AppImage; do
            [ -e "$f" ] || continue
            printf '  %s  %s 字节\n' "$(basename "$f")" "$(wc -c < "$f" | tr -d ' ')"
          done

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: tenon-${{ matrix.tag }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          # 130MB 级产物，保留 14 天够试用；长期归档应该走 Release，不是 artifact
          retention-days: 14

  # 推 tag 时把四份产物挂到 GitHub Release 上。
  #
  # 为什么要有这一步：artifact **14 天就过期，而且下载要登录**。想让人（或明天的自己）
  # 换个机器装一遍，需要的是一个稳定链接。Release 资产就是那个链接。
  #
  # 只在推 tag 时跑：Release 是"我决定发一版"的动作，不该由一次手点的打包触发。
  release:
    name: Release（推 tag 时）
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          # 四个产物各落到 dist/<artifact 名>/ 下
          pattern: tenon-*
          path: dist

      # 校验和解决的是"下载有没有坏"，不是"东西是不是我发的"（没有签名就做不到后者）。
      # 大文件在这台机器上实测会 EOF —— 有个 sha256 至少能区分"没下完"和"包本身坏了"。
      - name: 生成 SHA256SUMS
        shell: bash
        run: |
          cd dist
          shopt -s nullglob
          files=(*/*.dmg */*.zip */*.exe */*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::一个产物都没有，先看 package 那几个 job"
            exit 1
          fi
          # ★ 只写**文件名**，不写 `tenon-mac-x64/...` 这样的下载目录前缀：
          # Release 里的资产是平铺的，用户把三个文件下到同一个文件夹后要能直接
          # `shasum -a 256 -c SHA256SUMS.txt`。带前缀的路径会"文件不存在"。
          for f in "${files[@]}"; do
            ( cd "$(dirname "$f")" && sha256sum "$(basename "$f")" )
          done | sort -k2 > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 写 Release 说明
        shell: bash
        run: |
          cat > NOTES.md <<'NOTES'
          预览构建。四个平台各一份，都是**免安装依赖**的整包：
          Node 不用装、pnpm 随包、数据库是 WASM。

          | 文件 | 平台 |
          |---|---|
          | `Tenon-*-arm64.dmg` / `-arm64-mac.zip` | macOS（Apple Silicon） |
          | `Tenon-*.dmg` / `-mac.zip`（无 arm64 后缀） | macOS（Intel） |
          | `Tenon-*-setup.exe` | Windows x64（NSIS 安装包） |
          | `Tenon-*.AppImage` | Linux x64 |

          ## 首次打开可能被系统拦一次

          这一版是否带签名，取决于发布时仓库里配没配证书：

          - **已签名（且 macOS 已公证）**：双击即可打开
          - **未签名**：macOS 提示"无法验证开发者"→ 右键 → 打开 → 再点"打开"，
            或终端 `xattr -dr com.apple.quarantine /Applications/Tenon.app`；
            Windows 弹 SmartScreen → "更多信息" → "仍要运行"。这不是包坏了。
          - **Linux**：`chmod +x Tenon-*.AppImage` 再运行

          ## 自动更新

          桌面版会检查本仓库的 Releases。**未签名的包 macOS 不允许自动替换**，
          界面会明确提示改用手动下载；已签名的包点「重启安装」即可。

          ## 校验

          下载完先比一下 `SHA256SUMS.txt`（分辨"没下完"和"包本身坏了"）：

          ```bash
          shasum -a 256 -c SHA256SUMS.txt   # macOS / Linux
          ```

          ## 已知限制

          - Windows / Linux 的产物**没有被真启动过**（CI 上没有 GUI 会话）；
            只有 macOS 那份每次都会在 CI 里真启动一次。
          - 没有 Hub：「组件商店」会显示未配置，本地三个官方组件可正常安装使用。
          - 模型要自己配（OpenAI 兼容即可）；不配也能建应用、看 HMR，只是对话是 faux 假回复。
          NOTES
          cat NOTES.md

      - name: 建 Release 并上传
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 不 checkout（只要产物），所以 `gh` 需要显式告诉它仓库是哪个 ——
          # 否则报 `failed to run git: fatal: not a git repository`
          REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          TAG="${GITHUB_REF_NAME}"
          files=(dist/*/*.dmg dist/*/*.zip dist/*/*.exe dist/*/*.AppImage dist/SHA256SUMS.txt)

          # 带预发布后缀的 tag（如 v0.0.0-alpha.1）标成 prerelease，别让人以为这是正式版
          extra=()
          case "$TAG" in *-*) extra+=(--prerelease);; esac

          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，改为覆盖上传（重跑同一 tag 是常见操作）"
            gh release upload "$TAG" "${files[@]}" -R "$REPO" --clobber
          else
            gh release create "$TAG" "${files[@]}" -R "$REPO" \
              --title "Tenon $TAG" \
              --notes-file NOTES.md \
              "${extra[@]}"
          fi
          gh release view "$TAG" -R "$REPO" --json url,assets --jq '"URL: \(.url)\n" + (.assets[] | "  \(.name)  \(.size/1024/1024|floor)MB")'
