## 质量门禁：lint + 类型检查 + 测试 + 前端构建，**三个平台各跑一遍**
##
## 为什么要矩阵（v1.2.24）：
## 这套东西到处在 spawn 子进程、拼路径、判断退出码与 shell 文案 —— 这些行为**跨平台不一样**，
## 而且差别都藏在"本地绿、CI 红"里。已经真实发生过两次：
## - `pnpm` 把子进程的 127 折成 1（与"查到 3 个错误"同码）；
## - macOS 的 `sh` 说 `command not found`，Debian 的 `dash` 说 `not found`。
## 那两次都是 macOS → Linux 的差异，靠 ubuntu runner 抓到了。**反方向（macOS → Windows）
## 没有任何人能发现** —— 而 Windows 的差异更大（路径分隔符、cmd 而不是 sh、junction、
## 换行、进程组）。
##
## e2e 按**依赖成本**分三档，不是一个开关（v1.2.25）：
##
##   A 档 零依赖（`e2e:hub` / `e2e:diff` / `e2e:release` / `e2e:provider`）
##        不联网、不开浏览器、不要 docker，四条合计 **约 22 秒**。→ 进 `check`，**三平台都跑**。
##        它们恰好是跨平台差异的重灾区：系统 git、子进程退出码、路径拼法、临时目录。
##        "只在 macOS 绿"正是这套门禁最想抓的东西，所以不能退到只有 ubuntu。
##
##   B 档 要联网装依赖（`e2e:preview` / `e2e:fullstack` / `e2e:backend` / `e2e:auth`）
##        在生成的应用里 `pnpm install` React 或 NestJS，冷缓存 1–3 分钟。→ 只跑 **ubuntu**。
##        理由是它守的是"模板真能装起来、真能跑"（CJS/ESM、tsc+装饰器、PGlite pool.max=1），
##        这些**与宿主平台无关**；三份重复付网络成本换不到新信息。
##
##   C 档 要 docker（`e2e:postgres` / `e2e:docker`）
##        ubuntu runner 自带 docker，所以它们**不再 skip**，是真的跑起来。→ 独立 job。
##        独立而不并进 B 档：`e2e:docker` 要 build 镜像（拉 node + postgres，5 分钟级），
##        并进去会让"模板装不起来"和"镜像 build 不起来"两类红灯挤在同一条日志里。
##
## 仍然**不进** CI 的，只有两类，理由各不相同：
## - **GUI 类**（`e2e:apps` / `e2e:component` / `e2e:inspector` / `e2e:e2e` / `e2e:real` /
##   `e2e:packaged`）：要 Electron 二进制（100MB+）与真窗口，ubuntu 上还要 xvfb。
##   更要紧的是**它们验的是"人看得见对不对"**（气泡对齐、球有没有重复挂、Alt 描边），
##   失败时得有人盯着截图才有意义 —— 挂在门禁上只会变成"红了没人看，最后被 skip 掉"。
## - **三平台打包**：mac 不签名会被 Gatekeeper 拦，要 Apple 账号（$99/年）。
##   这件事单独做（`desktop.yml`），别和质量门禁混在一起 —— 门禁要快、要稳、要能天天绿。
##
## pnpm 版本从 `package.json` 的 `packageManager` 读（pnpm/action-setup 自己认），
## 不在这里再写一遍：写两遍就会出现"CI 用 9、本机用 10"这类只在 CI 复现的问题。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支连推两次时，把还在跑的旧那次取消：门禁的价值是"最新这一次绿不绿"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      # 一个平台红了不要遮住另外两个的结果：三份报告一起看才知道"是平台相关还是一般的坏"
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows runner 慢（文件系统 + 进程启动），718 项测试在那边要久一些
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 装 pnpm（版本来自 packageManager）
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      # 换行由 `.gitattributes` 保证（`* text=auto eol=lf`）。这里再断言一次：
      # 万一有人在 Windows 上改了配置又不小心提交了 CRLF，早失败比等到字节比对红好定位
      - name: 确认索引里没有 CRLF
        shell: bash
        run: |
          bad=$(git ls-files --eol | grep -E 'i/(crlf|mixed)' | head -5 || true)
          if [ -n "$bad" ]; then
            echo "::error::下面这些文件在索引里是 CRLF —— 检查 .gitattributes 是否生效"
            echo "$bad"
            exit 1
          fi
          echo "索引里全部 LF"

      # frozen-lockfile：lock 与 package.json 不一致时**当场失败**，
      # 而不是在 CI 里悄悄装出另一套依赖
      - name: 装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      # 最快的先跑（约 3 秒）：一条未用变量就没必要再等几分钟的类型检查
      - name: Lint
        run: pnpm lint

      # 类型错了就不必等测试
      - name: 类型检查（18 个 project）
        run: pnpm typecheck

      - name: 测试
        run: pnpm test

      # 前端构建放最后：它证明 web 真的能打出产物（不只是 tsc 通过）
      - name: 构建前端
        run: pnpm build:web

      # A 档 e2e：四条合计约 22 秒，零网络零 GUI。放三平台不是"顺手"，是它们
      # 专挑跨平台差异（系统 git、退出码、路径拼法）—— 只在 mac 上跑等于没跑
      - name: E2E（零依赖：不联网 / 不开浏览器 / 不要 docker）
        run: |
          pnpm e2e:hub
          pnpm e2e:diff
          pnpm e2e:release
          pnpm e2e:provider

      - name: 留存前端产物（排障用，不进 artifact 长期库）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-dist-${{ matrix.os }}
          path: apps/web/dist
          retention-days: 3
          if-no-files-found: ignore

  # ── B 档：要联网装 React / NestJS。只 ubuntu。 ────────────────────────────
  # needs: check 是故意的：矩阵里只要有平台红，先修平台问题，别在坏地基上跑更慢的验证
  e2e:
    name: e2e（联网装依赖）
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装 pnpm（版本来自 packageManager）
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      # 组件产物（`plugins/*/server.js` / `web.js`）在 .gitignore 里，checkout 不带它们。
      # `pnpm test` 靠 pretest 自动构建，但这几条 e2e 直接调 tsx，得显式来一次。
      - name: 构建组件产物
        run: pnpm build:plugins

      # 每条都自带"应用目录里 pnpm install"，所以冷缓存下每条 1–3 分钟。
      # 不合并成一个 run：分开才有独立日志与独立重跑，模板与鉴权是两套完全不同的坑
      - name: E2E：预览（Vite + 网关 + HMR）
        run: pnpm e2e:preview

      - name: E2E：全栈（PGlite + Nest + 迁移 + 重启后数据还在）
        run: pnpm e2e:fullstack

      - name: E2E：加后端（Nest 的 CJS 产物跑在 ESM 应用里）
        run: pnpm e2e:backend

      - name: E2E：加登录（全局守卫 + /api/health 必须公开 + cookie 穿过网关）
        run: pnpm e2e:auth

  # ── C 档：要 docker。ubuntu runner 自带守护进程，所以这两条会真跑而不是 skip。 ──
  # 单独一个 job：`e2e:docker` 要 build 镜像（拉 node + postgres），慢且失败原因独立
  e2e-docker:
    name: e2e（docker）
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 装 pnpm（版本来自 packageManager）
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: 装依赖
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: 构建组件产物
        run: pnpm build:plugins

      # 真 PostgreSQL：验跨档迁移（pglite → postgres）的搬与退
      - name: E2E：真 PostgreSQL
        run: pnpm e2e:postgres

      # 导出的 Docker 上下文真能 build + compose up + 打接口
      - name: E2E：Docker 导出
        run: pnpm e2e:docker

      # 容器/镜像留在 runner 上无所谓（runner 用完即弃），但失败时要能看见
      # 到底哪一步断的 —— docker 自己的日志比脚本的 tail 更早给出线索
      - name: 打印 docker 状态（失败排障）
        if: failure()
        run: |
          docker ps -a
          docker images
